<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f14" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EFB Brief" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>EFB Briefing</title>
    <script>
      // 첫 화면 깜빡임 방지: 그리기 전에 주간/야간 적용 (src/app/theme.ts 와 같은 규칙)
      (function () {
        var p = 'night';
        try { p = localStorage.getItem('efb.theme') || 'night'; } catch (e) {}
        var day = p === 'day' || (p === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.setAttribute('data-theme', day ? 'light' : 'dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
